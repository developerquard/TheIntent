name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: $\{{ secrets.SSH_HOST }}
          username: $\{{ secrets.SSH_USERNAME }}
          key: $\{{ secrets.SSH_KEY }}
          port: $\{{ secrets.SSH_PORT }}
          script: |
            cd /var/www/socialdiscovery
            ./scripts/deploy.sh
